name: FlowFi Live Scanner

on:
  workflow_dispatch:

  schedule:
    # Monday-Friday (UTC)
    # 09:15 IST
    - cron: "45 3 * * 1-5"

    # 11:00 IST
    - cron: "30 5 * * 1-5"

    # 01:00 PM IST
    - cron: "30 7 * * 1-5"

    # 03:25 PM IST
    - cron: "55 9 * * 1-5"

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FlowFi Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
