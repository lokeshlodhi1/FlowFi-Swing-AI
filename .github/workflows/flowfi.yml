- name: Debug Files
  run: |
    pwd
    ls -R app/market_data
    echo "===== market_data/__init__.py ====="
    cat app/market_data/__init__.py
    echo "===== runner.py ====="
    head -40 runner.py

- name: Run FlowFi Scanner
  env:
    TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
    TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  run: |
    python main.py
